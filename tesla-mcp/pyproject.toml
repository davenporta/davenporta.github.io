[project]
name = "tesla-mcp"
version = "0.1.0"
description = "Self-hosted, read-mostly MCP server for the Tesla Fleet API (maintenance + climate only)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tesla-mcp = "tesla_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tesla_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
